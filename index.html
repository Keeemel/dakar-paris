                    timeZone: timezone,
                    hour: "2-digit",
                    minute: "2-digit"
                }).format(localNow);

                const localDateLabel = new Intl.DateTimeFormat("fr-FR", {
                    timeZone: timezone,
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }).format(localNow);

                const weatherLabel = stepData?.jour
                    ? `Météo du jour ${stepData.jour}`
                    : "Météo locale";

                const weatherDateLabel = (stepData?.date || weatherDate)
                    ? formatWeatherDate(stepData?.date || weatherDate)
                    : localDateLabel;

                weatherLoading.hidden = true;
                weatherContent.innerHTML = `
                    <div class="weather-heading">
                        <div>
                            <div class="weather-kicker">${weatherLabel} · ${weatherDateLabel}</div>
                            <div class="weather-place">${escapeHTML(place || "Position actuelle")}</div>
                            <div class="weather-updated">Heure locale : ${localTimeLabel}</div>
                        </div>
                        <div class="weather-icon" aria-hidden="true">${currentDescription[1]}</div>
                    </div>
                    <div class="weather-current">
                        <div class="weather-temperature">${Math.round(currentTemperature)}°</div>
                        <div>
                            <div class="weather-description">${currentDescription[0]}</div>
                            <div class="weather-details">
                                <span>Ressenti ${Math.round(currentApparent)}°</span>
                                <span>Vent ${Math.round(currentWind)} km/h</span>
                            </div>
                        </div>
                    </div>
                    <div class="weather-details" style="justify-content: space-between; margin-top: 4px;">
                        <span>Pluie ${Math.round(currentRain)}%</span>
                        <span>${localDateLabel}</span>
                    </div>
                    <div class="weather-forecast">

        function decodeRailwayPolyline(encoded) {
            const coordinates = [];
            let index = 0;
            let latitude = 0;
            let longitude = 0;

            while (index < encoded.length) {
                const readDelta = () => {
                    let result = 0;
                    let shift = 0;
                    let byte;

                    do {
                        byte = encoded.charCodeAt(index++) - 63;
                        result |= (byte & 0x1f) << shift;
                        shift += 5;
                    } while (byte >= 0x20);

                    return result & 1 ? ~(result >> 1) : result >> 1;
                };

                latitude += readDelta();
                longitude += readDelta();
                coordinates.push([latitude / 1e5, longitude / 1e5]);
            }

            return coordinates;
        }

        function findRailwayPath(elements, start, end) {
            const adjacency = new Map();
            const nodeCoordinates = new Map();

            const addEdge = (from, to, distance) => {
                if (!adjacency.has(from)) {
                    adjacency.set(from, []);
                }
                adjacency.get(from).push({ node: to, distance });
            };

            const distanceBetween = (first, second) => {
                const radians = value => value * Math.PI / 180;
                const latitudeDelta = radians(second[0] - first[0]);
                const longitudeDelta = radians(second[1] - first[1]);
                const a =
                    Math.sin(latitudeDelta / 2) ** 2 +
                    Math.cos(radians(first[0])) *
                    Math.cos(radians(second[0])) *
                    Math.sin(longitudeDelta / 2) ** 2;

                return 6371000 * 2 * Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );
            };

            for (const way of elements) {
                if (!Array.isArray(way.geometry) || way.geometry.length < 2) {
                    continue;
                }

                const nodeIds = way.nodes || [];
                const wayNodes = way.geometry.map((point, index) => {
                    const node = nodeIds[index] ?? `${point.lat},${point.lon}`;
                    const coordinate = [Number(point.lat), Number(point.lon)];
                    nodeCoordinates.set(node, coordinate);
                    return node;
                });

                for (let index = 0; index < wayNodes.length - 1; index++) {
                    const first = wayNodes[index];
                    const second = wayNodes[index + 1];
                    const distance = distanceBetween(
                        nodeCoordinates.get(first),
                        nodeCoordinates.get(second)
                    );
                    addEdge(first, second, distance);
                    addEdge(second, first, distance);
                }
            }

            if (!nodeCoordinates.size) {
                throw new Error("Aucune géométrie ferroviaire reçue.");
            }

            const nearestNode = coordinate => {
                let nearest = null;
                let nearestDistance = Infinity;

                for (const [node, nodeCoordinate] of nodeCoordinates) {
                    const distance = distanceBetween(coordinate, nodeCoordinate);
                    if (distance < nearestDistance) {
                        nearest = node;
                        nearestDistance = distance;
                    }
                }

                if (nearest === null || nearestDistance > 20000) {
                    throw new Error(
                        "Voie ferrée trop éloignée d’une étape du parcours."
                    );
                }

                return nearest;
            };

            const startNode = nearestNode(start);
            const endNode = nearestNode(end);
            const distances = new Map([[startNode, 0]]);
            const previous = new Map();
            const queue = [[0, startNode]];

            const push = entry => {
                queue.push(entry);
                let index = queue.length - 1;
                while (index > 0) {
                    const parent = Math.floor((index - 1) / 2);
                    if (queue[parent][0] <= entry[0]) {
                        break;
                    }
                    queue[index] = queue[parent];
                    index = parent;
                }
                queue[index] = entry;
            };

            const pop = () => {
                const first = queue[0];
                const last = queue.pop();

                if (queue.length && last) {
                    let index = 0;
                    while (true) {
                        const left = index * 2 + 1;
                        const right = left + 1;
                        if (left >= queue.length) {
                            break;
                        }
                        const child =
                            right < queue.length && queue[right][0] < queue[left][0]
                                ? right
                                : left;
                        if (queue[child][0] >= last[0]) {
                            break;
                        }
                        queue[index] = queue[child];
                        index = child;
                    }
                    queue[index] = last;
                }

                return first;
            };

            while (queue.length) {
                const [distance, node] = pop();
                if (distance !== distances.get(node)) {
                    continue;
                }
                if (node === endNode) {
                    break;
                }

                for (const edge of adjacency.get(node) || []) {
                    const nextDistance = distance + edge.distance;
                    if (nextDistance < (distances.get(edge.node) ?? Infinity)) {
                        distances.set(edge.node, nextDistance);
                        previous.set(edge.node, node);
                        push([nextDistance, edge.node]);
                    }
                }
            }

            if (!distances.has(endNode)) {
                throw new Error(
                    "Impossible de relier Choum et Nouadhibou par le réseau ferroviaire."
                );
            }

            const path = [];
            for (let node = endNode; node !== undefined; node = previous.get(node)) {
                path.push(nodeCoordinates.get(node));
                if (node === startNode) {
                    break;
                }
            }

            if (path.length === 0 || path[path.length - 1] !== nodeCoordinates.get(startNode)) {
                throw new Error("Le tracé ferroviaire est incomplet.");
            }

            path.reverse();
            return {
                type: "LineString",
                coordinates: [
                    [start[1], start[0]],
                    ...path.map(coordinate => [coordinate[1], coordinate[0]]),
                    [end[1], end[0]]
                ]
            };
        }

        function getRailwayRoute(start, end) {
            const railwayCoordinates = decodeRailwayPolyline(
                atob(CHOUM_NOUADHIBOU_RAILWAY_POLYLINE)
            );
            const railwayWay = {
                nodes: railwayCoordinates.map((_, index) => index),
                geometry: railwayCoordinates.map(([lat, lon]) => ({ lat, lon }))
            };

            return findRailwayPath([railwayWay], start, end);
        }

        async function drawRoute(coordinates, routeColors, railwaySegments = [], stepIds = [], onProgress = null, resolvePrefetch = null) {

            if (coordinates.length < 2) {
                if (resolvePrefetch) resolvePrefetch();
                return;
            }

            console.log(
                "Calcul des trajets..."
            );

            const total = coordinates.length - 1;

            /*
             * 1) On lance tous les calculs d'itinéraire en parallèle
             *    (3 à la fois, pour ménager le serveur OSRM).
             */
            const geometries = [];

            for (let i = 0; i < total; i++) {

                const start = coordinates[i];
                const end = coordinates[i + 1];

                const pending = railwaySegments[i]
                    ? Promise.resolve().then(() => getRailwayRoute(start, end))
                    : osrmSchedule(() => fetchRouteGeometry(start, end));

                pending.catch(() => { });
                geometries.push(pending);
            }

            let settled = 0;

            Promise.all(geometries.map(pending =>
                pending.then(() => { }, () => { }).then(() => {
                    settled++;
                    if (onProgress) onProgress(settled, total);
                })
            )).then(() => {
                if (resolvePrefetch) resolvePrefetch();
            });

            /*
             * 2) On attend la fin de l'intro, puis on dessine
             *    segment par segment, dans l'ordre, en faisant
             *    apparaître chaque étape quand le tracé l'atteint.
             */
            await introReady;

            revealMarker(stepIds[0]);

            for (let i = 0; i < total; i++) {

                const start = coordinates[i];
                const end = coordinates[i + 1];

                const route = routeColors[i] || { color: "#25231f" };
                const color = route.color;

                const isRailway = Boolean(railwaySegments[i]);

                let layer = null;
                let baseOpacity = 0.92;

                try {

                    const geometry = await geometries[i];

                    layer = L.geoJSON(
                        geometry,
                        {
                            style: {
                                color,
                                weight: isRailway ? 6 : 5,
                                opacity: baseOpacity,
                                dashArray: isRailway ? null : "10 7",
                                lineCap: "round",
                                lineJoin: "round"
                            }
                        }
                    ).addTo(map);

                } catch (error) {

                    if (isRailway) {
                        console.error(
                            "Impossible de tracer le segment ferroviaire Choum–Nouadhibou.",
                            error
                        );
                        document.getElementById("routeStatus").textContent =
                            "Tracé ferroviaire indisponible";
                        revealMarker(stepIds[i + 1]);
                        continue;
                    }

                    console.warn(
                        `Impossible de calculer le segment ${i + 1}`,
                        error
                    );

                    /* Si OSRM ne trouve pas la route : ligne directe. */
                    baseOpacity = 0.8;

                    layer = L.polyline(
                        [start, end],
                        {
                            color,
                            weight: 5,
                            opacity: baseOpacity,
                            dashArray: "10 7",
                            lineCap: "round",
                            lineJoin: "round"
                        }
                    ).addTo(map);
                }

                if (route.day) {
                    const baseWeight = isRailway ? 6 : 5;

                    layer.on("mouseover", () => {
                        layer.setStyle({
                            weight: 9,
                            opacity: 1
                        });
                        showJourneyVideo(route.day);
                    });

                    layer.on("mouseout", () => {
                        layer.setStyle({
                            weight: baseWeight,
                            opacity: baseOpacity
                        });
                        scheduleVideoHide();
                    });
                }

                const paths = await animateDraw(layer);

                revealMarker(stepIds[i + 1]);

                /* Ligne "prochaine étape" : pointillés qui avancent */
                if (!route.day) {
                    paths.forEach(el => el.classList.add("route-flow"));
                }
            }

            console.log(
                "Trajet terminé."
            );

        }

        /* File d'attente OSRM : 3 requêtes en parallèle maximum */
        const osrmQueue = [];
        let osrmActive = 0;

        function osrmSchedule(task) {
            return new Promise((resolve, reject) => {
                osrmQueue.push({ task, resolve, reject });
                osrmPump();
            });
        }

        function osrmPump() {
            while (osrmActive < 3 && osrmQueue.length) {
                const { task, resolve, reject } = osrmQueue.shift();
                osrmActive++;
                task().then(resolve, reject).finally(() => {
                    osrmActive--;
                    osrmPump();
                });
            }
        }

        async function fetchRouteGeometry(start, end) {
            const url =
                "https://router.project-osrm.org/route/v1/driving/" +
                `${start[1]},${start[0]};` +
                `${end[1]},${end[0]}` +
                "?overview=full&geometries=geojson";

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `OSRM HTTP ${response.status}`
                );
            }

            const data = await response.json();

            if (
                data.code !== "Ok" ||
                !data.routes ||
                !data.routes.length
            ) {
                throw new Error(
                    "Aucune route trouvée."
                );
            }

            return data.routes[0].geometry;
        }

        /* Les tracés s'animent l'un après l'autre, jamais en même temps */
        let routeChain = Promise.resolve();

        function drawRouteInBackground(coordinates, routeColors, railwaySegments = [], stepIds = [], onProgress = null) {
            let resolvePrefetch;
            const prefetched = new Promise(resolve => { resolvePrefetch = resolve; });

            routeChain = routeChain
                .then(() => drawRoute(coordinates, routeColors, railwaySegments, stepIds, onProgress, resolvePrefetch))
                .catch(error => {
                    console.error("Impossible d’afficher les tracés.", error);
                    document.getElementById("routeStatus").textContent =
                        "Tracés indisponibles";
                    resolvePrefetch();
                });

            return prefetched;
        }


        /* ==================================================

        ================================================== */

        async function displayJourney(etapes) {

            const FIXED_NEXT_STEP_ID = 1000;

            const currentStep =
                etapes
                    .filter(step => Number(step.id) !== FIXED_NEXT_STEP_ID)
                    .sort((a, b) => Number(b.id) - Number(a.id))[0] ||
                etapes[etapes.length - 1] ||
                null;

            const latestIndex = currentStep
                ? etapes.findIndex(step => Number(step.id) === Number(currentStep.id))
                : etapes.length - 1;

            const nextStep =
                etapes.find(step => Number(step.id) === FIXED_NEXT_STEP_ID) ||
                null;

            const currentPoint = currentStep
                ? [Number(currentStep.latitude), Number(currentStep.longitude)]
                : null;

            const nextPoint = nextStep
                ? [Number(nextStep.latitude), Number(nextStep.longitude)]
                : null;

            /*
             * Marqueurs
             */
            etapes.forEach((etape, index) => {

                const lat =
                    Number(etape.latitude);

                const lng =
                    Number(etape.longitude);


                const isCurrent =
                    Number(etape.id) === Number(currentStep?.id);


                const marker =
                    L.marker(
                        [lat, lng],
                        {

                            icon:
                                isCurrent
                                    ? createCurrentIcon()
                                    : createNormalIcon(getDayColor(etape.jour)),

                            zIndexOffset:
                                isCurrent
                                    ? 1000
                                    : 0

                        }
                    );


                marker
                    .bindPopup(
                        createPopup(etape),
                        {
                            closeButton: true,
                            ...getPopupPadding()
                        }
                    )
                    .on("click", () => {
                        loadWeather(
                            [lat, lng],
                            etape.titre,
                            etape
                        );
                    })
                    .addTo(map);


                /*
                 * Animation d'apparition
                 */
                markerById[etape.id] = marker;

            });


            setLoaderProgress(45, "Placement des étapes…");

            const coordinates = etapes.map(etape => [
                Number(etape.latitude),
                Number(etape.longitude)
            ]);

            if (coordinates.length > 1) {
                journeyBounds = L.latLngBounds(coordinates);
                map.fitBounds(journeyBounds, { animate: false, ...getFitOptions() });
            }

            const routeSteps = etapes
                .filter(etape => Number(etape.id) !== FIXED_NEXT_STEP_ID);
            const routeCoordinates = routeSteps
                .map(etape => [
                    Number(etape.latitude),
                    Number(etape.longitude)
                ]);
            const normalizePlaceName = value => String(value || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase();
            const railwaySegments = routeSteps.slice(0, -1).map((step, index) => {
                const startTitle = normalizePlaceName(step.titre);
                const endTitle = normalizePlaceName(routeSteps[index + 1].titre);
                const isNouadhibou = title =>
                    title.includes("nouadhib") || title.includes("nouadib");
                return (
                    (startTitle.includes("choum") && isNouadhibou(endTitle)) ||
                    (isNouadhibou(startTitle) && endTitle.includes("choum"))
                );
            });

            const dayColors = DAY_COLORS;

            const daysPresent = [...new Set(
                etapes
                    .filter(etape => Number(etape.jour) > 0)
                    .map(etape => Number(etape.jour))
            )];
            const legendItems = document.getElementById("legendItems");

            legendItems.innerHTML = daysPresent.map(day => `
                <div class="legend-item" title="Jour ${escapeHTML(day)}">
                    <span class="legend-swatch" style="background:${dayColors[(day - 1) % dayColors.length]}"></span>
                    <span>J${escapeHTML(day)}</span>
                </div>
            `).join("");

            if (nextStep && Number(nextStep.jour) === 0) {
                legendItems.innerHTML += `
                    <div class="legend-item">
                        <span class="legend-swatch" style="background:#8e8a84"></span>
                        <span>Prochaine étape</span>
                    </div>
                `;
            }

            document.getElementById("stepCount").textContent =
                `${etapes.length} étapes`;

            document.getElementById("routeStatus").textContent =
                `${daysPresent.length} jours cartographiés`;

            const routeColors = routeCoordinates.slice(0, -1).map((_, index) => {
                const etape = routeSteps[index];
                const day = Number(etape?.jour || 0);
                const isNeutral = day === 0 || Number(etape?.id) === FIXED_NEXT_STEP_ID;

                return {
                    day,
                    color: isNeutral ? "#8e8a84" : dayColors[(day - 1) % dayColors.length]
                };

            });

            const routePrefetch = drawRouteInBackground(
                routeCoordinates,
                routeColors,
                railwaySegments,
                routeSteps.map(step => step.id),
                (done, total) => setLoaderProgress(
                    45 + Math.round(50 * done / total),
                    `Calcul du tracé ${done}/${total}`
                )
            );


            /*
             * Compteur
             */
            const currentDay =
                document.getElementById("currentDay");

            setProgress(
                currentDay,
                currentStep?.jour ?? etapes[latestIndex]?.jour ?? ""
            );

            const latestCoordinateValue = currentPoint || coordinates[latestIndex] || coordinates[coordinates.length - 1] || null;

            latestCoordinate = latestCoordinateValue;

            if (currentPoint && nextPoint && coordinates.length > 1) {
                drawRouteInBackground(
                    [currentPoint, nextPoint],
                    [{ day: 0, color: "#8e8a84" }],
                    [],
                    [currentStep.id, FIXED_NEXT_STEP_ID]
                );

                const nextStepMarker = L.marker(nextPoint, {
                    icon: createNextStepIcon(),
                    zIndexOffset: 200
                }).addTo(map);

                markerById.next = nextStepMarker;

                nextStepMarker.bindPopup(`
                    <div class="popup">
                        <div class="popup-day">Prochaine étape</div>
                        <div class="popup-title">${escapeHTML(nextStep.titre || "À venir")}</div>
                        <div class="popup-description">${escapeHTML(nextStep.description || "Suite du parcours.")}</div>
                    </div>
                `);
            }

            /* On laisse le loader affiché le temps de calculer les routes */
            await Promise.race([routePrefetch, sleep(7000)]);

            loadWeather(
                latestCoordinateValue,
                currentStep?.titre ?? etapes[latestIndex]?.titre ?? "Position actuelle",
                currentStep ?? etapes[latestIndex]
            );




        }


        /* ==================================================
           LANCEMENT
        ================================================== */

        loadJourney();
        initTwitchLive();
        initUI();

    </script>

</body>
