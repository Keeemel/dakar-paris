<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Le parcours — Dakar → Paris</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Nunito", sans-serif;
            background: #f4f0e8;
        }

        /* =========================
           CARTE
        ========================= */

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: fixed;
            top: 24px;
            left: 24px;

            z-index: 1000;

            padding: 18px 22px;

            background: rgba(255, 252, 246, 0.94);
            backdrop-filter: blur(14px);

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);

            max-width: 340px;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1.5px;

            color: #77716a;

            margin-bottom: 4px;
        }

        .header h1 {
            font-size: 28px;
            line-height: 1;

            font-weight: 900;

            color: #25231f;

            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            line-height: 1.45;

            color: #625e57;
        }

        .header-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .header-meta span {
            padding: 5px 9px;
            border-radius: 999px;
            background: #eee8de;
            color: #625e57;
            font-size: 11px;
            font-weight: 800;
        }

        /* =========================
           COMPTEUR
        ========================= */

        .progress {
            position: fixed;

            right: 24px;
            top: 24px;

            z-index: 1000;

            background: rgba(255, 252, 246, 0.94);
            backdrop-filter: blur(14px);

            border-radius: 18px;

            padding: 14px 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .progress-number {
            display: block;

            font-size: 28px;
            line-height: 1;

            font-weight: 900;

            color: #25231f;
        }

        .progress-label {
            display: block;

            margin-top: 3px;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 1px;

            color: #77716a;
        }

        .map-tools {
            position: fixed;
            top: 108px;
            right: 24px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: min(420px, calc(100vw - 48px));
            justify-content: flex-end;
        }

        .map-tool {
            min-height: 40px;
            padding: 0 13px;
            border: 1px solid rgba(37, 35, 31, 0.12);
            border-radius: 12px;
            background: rgba(255, 252, 246, 0.94);
            color: #25231f;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.1px;
            transition: all 0.22s ease;
        }

        .map-tool.active {
            background: linear-gradient(135deg, #1d3450, #2a4d6f);
            color: #fff;
            border-color: rgba(37, 35, 31, 0.1);
            box-shadow: 0 10px 26px rgba(29, 52, 80, 0.24);
        }

        .weather-wind-arrow {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(10, 104, 147, 0.18);
            border: 2px solid rgba(10, 104, 147, 0.9);
            color: #0a6893;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 4px 16px rgba(10, 104, 147, 0.18);
        }

        .map-tool:hover,
        .map-tool:focus-visible {
            background: #25231f;
            color: #fff;
            outline: none;
        }

        .weather-card {
            position: fixed;
            top: 164px;
            right: 24px;
            z-index: 1000;
            width: 275px;
            padding: 15px;
            border: 1px solid rgba(37, 35, 31, 0.1);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 252, 246, 0.98), rgba(247, 243, 236, 0.96));
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border-top: 4px solid rgba(26, 85, 122, 0.8);
        }

        .weather-card[aria-hidden="true"] {
            display: none;
        }

        .live-card {
            position: fixed;
            top: 470px;
            right: 24px;
            z-index: 1000;
            width: 275px;
            padding: 0;
            border: 0;
            border-radius: 14px;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
            overflow: hidden;
            pointer-events: none;
        }

        .live-header {
            display: none;
        }

        .live-preview-wrap {
            position: relative;
            overflow: hidden;
            border: 0;
            border-radius: 14px;
            background: #0e0e10;
            box-shadow: none;
            pointer-events: none;
        }

        .live-preview-wrap iframe,
        #twitch-live,
        #twitch-live iframe {
            display: block;
            border: 0 !important;
            border-radius: 14px !important;
            overflow: hidden;
            pointer-events: none;
        }

        .live-button {
            display: none;
        }

        .weather-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .weather-kicker {
            color: #77716a;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .weather-place {
            margin-top: 2px;
            color: #25231f;
            font-size: 15px;
            font-weight: 900;
        }

        .weather-updated {
            margin-top: 3px;
            color: #999188;
            font-size: 10px;
        }

        .weather-current {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 13px 0;
        }

        .weather-icon {
            font-size: 30px;
            line-height: 1;
        }

        .weather-temperature {
            color: #25231f;
            font-size: 27px;
            font-weight: 900;
            line-height: 1;
        }

        .weather-description {
            margin-top: 4px;
            color: #625e57;
            font-size: 11px;
            font-weight: 800;
        }

        .weather-details {
            display: flex;
            gap: 12px;
            color: #625e57;
            font-size: 10px;
            font-weight: 800;
        }

        .weather-forecast {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 13px;
            padding-top: 11px;
            border-top: 1px solid rgba(37, 35, 31, 0.1);
        }

        .forecast-day {
            text-align: center;
            color: #625e57;
            font-size: 10px;
            font-weight: 800;
        }

        .forecast-icon {
            display: block;
            margin: 5px 0 3px;
            font-size: 17px;
        }

        .forecast-temperatures {
            color: #25231f;
            font-size: 10px;
            font-weight: 900;
        }

        .weather-loading {
            color: #625e57;
            font-size: 12px;
            font-weight: 800;
        }

        .map-legend {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 1000;
            width: 190px;
            padding: 14px;
            border: 1px solid rgba(37, 35, 31, 0.1);
            border-radius: 15px;
            background: rgba(255, 252, 246, 0.94);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .legend-title {
            margin-bottom: 9px;
            color: #25231f;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .legend-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #625e57;
            font-size: 11px;
            font-weight: 800;
        }

        .legend-swatch {
            width: 18px;
            height: 5px;
            border-radius: 4px;
        }

        /* =========================
           MARQUEURS
        ========================= */

        .step-marker {
            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #25231f;

            border: 3px solid #fff;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .current-marker {
            position: relative;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: #e35d3f;

            border: 4px solid white;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.25);
        }

        .current-marker::before {
            content: "";

            position: absolute;

            top: 50%;
            left: 50%;

            width: 34px;
            height: 34px;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border: 2px solid rgba(227, 93, 63, 0.55);

            animation: pulse 2s infinite;
        }

        .next-step-marker {
            position: relative;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            background: #f5f2ed;

            border: 2px solid rgba(98, 94, 87, 0.75);

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .next-step-marker::before {
            content: "";

            position: absolute;

            inset: 4px;

            border-radius: 50%;

            background: rgba(98, 94, 87, 0.55);
        }

        @keyframes pulse {

            0% {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 1;
            }

            70% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        /* =========================
           POPUP
        ========================= */

        .leaflet-popup-content-wrapper {
            border-radius: 18px;

            padding: 0;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.16);
        }

        .leaflet-popup-content {
            margin: 0;

            width: 260px !important;
        }

        .popup {
            padding: 18px;
        }

        .popup-day {
            display: inline-block;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1px;

            color: #e35d3f;

            margin-bottom: 5px;
        }

        .popup-title {
            font-size: 20px;
            font-weight: 900;

            color: #25231f;

            margin-bottom: 7px;
        }

        .popup-description {
            font-size: 13px;
            line-height: 1.5;

            color: #625e57;
        }

        .popup-date {
            margin-top: 12px;

            font-size: 11px;
            font-weight: 700;

            color: #999188;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            position: fixed;

            inset: 0;

            z-index: 2000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f4f0e8;

            font-size: 16px;
            font-weight: 800;

            color: #25231f;

            transition: opacity 0.4s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* =========================
           VIDÉO DU JOUR
        ========================= */

        .journey-video {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1200;
            width: min(360px, calc(100vw - 48px));
            padding: 12px;
            background: rgba(255, 252, 246, 0.96);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(37, 35, 31, 0.12);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .journey-video.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .journey-video-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 2px 9px;
        }

        .journey-video-title {
            font-size: 13px;
            font-weight: 900;
            color: #25231f;
        }

        .journey-video-close {
            display: grid;
            width: 26px;
            height: 26px;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: #eee8de;
            color: #25231f;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .journey-video-close:hover {
            background: #e35d3f;
            color: #fff;
        }

        .journey-video-frame {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 11px;
            background: #25231f;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                top: 14px;
                left: 14px;
                right: 14px;

                max-width: none;

                padding: 15px 17px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 13px;
            }

            .progress {
                top: auto;
                right: 14px;
                bottom: 20px;

                padding: 11px 15px;
            }

            .progress-number {
                font-size: 23px;
            }

            .map-tools {
                top: auto;
                right: 14px;
                bottom: 100px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .map-tool {
                min-height: 36px;
                padding: 0 10px;
                font-size: 11px;
            }

            .map-legend {
                display: none;
            }

            .weather-card {
                top: 190px;
                right: 14px;
                width: calc(100vw - 28px);
            }

            .journey-video {
                right: 14px;
                bottom: 14px;
                width: calc(100vw - 28px);
            }
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div class="loading" id="loading">
        Le parcours se charge...
    </div>

    <!-- Header -->
    <div class="header">

        <div class="eyebrow">
            Dakar → Paris
        </div>

        <h1>
            Le parcours
        </h1>

        <p>
            31 jours à pied et en stop.
            Suivez chaque étape du voyage de Nico,
            Ilhan et Flamby.
        </p>

        <div class="header-meta">
            <span id="stepCount">Chargement...</span>
            <span id="routeStatus">Parcours en cours</span>
        </div>

    </div>

    <!-- Compteur -->
    <div class="progress">

        <span class="progress-number" id="currentDay">
            —
        </span>

        <span class="progress-label">
            jours parcourus
        </span>

    </div>

    <div class="map-tools" aria-label="Outils de carte">
        <button class="map-tool" id="fitJourney" type="button">Voir le voyage</button>
        <button class="map-tool" id="locateLatest" type="button">Dernière étape</button>
    </div>

    <aside class="weather-card" id="weatherCard" aria-hidden="true" aria-live="polite">
        <div class="weather-loading" id="weatherLoading">Chargement de la météo...</div>
        <div id="weatherContent"></div>
    </aside>

    <aside class="live-card" aria-label="Live Twitch Nico La">
        <div id="twitch-live-player" class="live-preview-wrap" style="min-height: 150px; background: #0e0e10;">
            <div id="twitch-live" style="width:100%; height:150px;"></div>
        </div>
    </aside>

    <aside class="map-legend" aria-label="Légende des jours">
        <div class="legend-title">Couleurs des jours</div>
        <div class="legend-items" id="legendItems"></div>
    </aside>

    <!-- Résumé vidéo affiché au survol d'un trajet -->
    <aside class="journey-video" id="journeyVideo" aria-hidden="true">

        <div class="journey-video-header">
            <span class="journey-video-title" id="journeyVideoTitle"></span>
            <button class="journey-video-close" id="journeyVideoClose" type="button" title="Fermer la vidéo"
                aria-label="Fermer la vidéo">
                ×
            </button>
        </div>

        <iframe class="journey-video-frame" id="journeyVideoFrame" title="Résumé vidéo du jour"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </aside>

    <!-- Carte -->
    <div id="map"></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="https://player.twitch.tv/js/embed/v1.js"></script>

    <script>

        function initTwitchLive() {
            const target = document.getElementById("twitch-live");
            if (!target || !window.Twitch || !window.Twitch.Player) {
                return;
            }

            const currentHost = window.location.hostname || "localhost";

            const player = new window.Twitch.Player("twitch-live", {
                channel: "nico_la",
                width: "100%",
                height: "150",
                parent: [currentHost],
                autoplay: true,
                muted: true,
                controls: false
            });

            player.addEventListener(window.Twitch.Player.READY, () => {
                player.setMuted(true);
                player.play();
            });

            window.setTimeout(() => {
                player.setMuted(true);
                player.play();
            }, 1200);
        }

        /* ==================================================
           CARTE
        ================================================== */

        const map = L.map("map", {

            zoomControl: false,

            center: [22, -5],

            zoom: 4

        });


        /* Fond de carte */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }
        ).addTo(map);

        /* Zoom */

        L.control.zoom({
            position: "bottomright"
        }).addTo(map);

        let journeyBounds = null;
        let latestCoordinate = null;

        window.weatherOverlayLayer = null;
        window.weatherOverlayMode = null;

        const weatherCard =
            document.getElementById("weatherCard");

        const weatherLoading =
            document.getElementById("weatherLoading");

        const weatherContent =
            document.getElementById("weatherContent");

        const weatherDescriptions = {
            0: ["Ciel dégagé", "☀️"],
            1: ["Principalement dégagé", "🌤️"],
            2: ["Partiellement nuageux", "⛅"],
            3: ["Couvert", "☁️"],
            45: ["Brouillard", "🌫️"],
            48: ["Brouillard givrant", "🌫️"],
            51: ["Bruine légère", "🌦️"],
            53: ["Bruine", "🌦️"],
            55: ["Bruine forte", "🌧️"],
            61: ["Pluie légère", "🌦️"],
            63: ["Pluie", "🌧️"],
            65: ["Forte pluie", "🌧️"],
            71: ["Neige légère", "🌨️"],
            73: ["Neige", "🌨️"],
            75: ["Forte neige", "❄️"],
            80: ["Averses légères", "🌦️"],
            81: ["Averses", "🌧️"],
            82: ["Fortes averses", "⛈️"],
            95: ["Orage", "⛈️"],
            96: ["Orage avec grêle", "⛈️"],
            99: ["Orage fort", "⛈️"]
        };

        function getWeatherDescription(code) {
            return weatherDescriptions[code] || ["Conditions variables", "🌡️"];
        }

        function formatForecastDay(date, index) {
            if (index === 0) {
                return "Aujourd'hui";
            }

            return new Date(`${date}T12:00:00`).toLocaleDateString("fr-FR", {
                weekday: "short"
            }).replace(".", "");
        }

        function formatWeatherDate(dateValue) {
            if (!dateValue) {
                return "aujourd'hui";
            }

            const date = new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return "aujourd'hui";
            }

            return date.toLocaleDateString("fr-FR", {
                weekday: "long",
                day: "numeric",
                month: "long"
            });
        }

        function getEstimatedWeatherDate(stepData) {
            if (stepData?.date) {
                return new Date(stepData.date);
            }

            const stepDay = Number(stepData?.jour) || 1;
            const latestDay = Number(document.getElementById("currentDay")?.textContent) || stepDay;
            const estimatedDate = new Date();
            estimatedDate.setHours(12, 0, 0, 0);
            estimatedDate.setDate(estimatedDate.getDate() - Math.max(0, latestDay - stepDay));
            return estimatedDate;
        }

        function buildWeatherParams(coordinate, dateValue) {
            const params = {
                latitude: coordinate[0].toFixed(4),
                longitude: coordinate[1].toFixed(4),
                hourly: "temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation_probability",
                daily: "weather_code,temperature_2m_max,temperature_2m_min",
                timezone: "auto",
                forecast_days: "5"
            };

            if (dateValue) {
                const targetDate = new Date(dateValue);

                if (!Number.isNaN(targetDate.getTime())) {
                    const startDate = new Date(targetDate);
                    startDate.setHours(0, 0, 0, 0);

                    const endDate = new Date(startDate);
                    endDate.setDate(endDate.getDate() + 1);

                    params.start_date = startDate.toISOString().slice(0, 10);
                    params.end_date = endDate.toISOString().slice(0, 10);
                    delete params.forecast_days;
                }
            }

            return new URLSearchParams(params);
        }

        function findNearestWeatherHour(hourlyTimes, dateValue) {
            if (!Array.isArray(hourlyTimes) || !hourlyTimes.length) {
                return 0;
            }

            const targetDate = new Date(dateValue || Date.now());
            targetDate.setMinutes(0, 0, 0);

            let nearestIndex = 0;
            let nearestDelta = Number.MAX_SAFE_INTEGER;

            hourlyTimes.forEach((time, index) => {
                const candidateTime = new Date(time);
                const delta = Math.abs(candidateTime.getTime() - targetDate.getTime());

                if (delta < nearestDelta) {
                    nearestDelta = delta;
                    nearestIndex = index;
                }
            });

            return nearestIndex;
        }

        async function loadWeather(coordinate, place, stepData = null) {

            weatherCard.setAttribute("aria-hidden", "false");
            weatherLoading.hidden = false;
            weatherContent.innerHTML = "";

            const weatherDate = getEstimatedWeatherDate(stepData);
            const params = buildWeatherParams(coordinate, weatherDate);

            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?${params}`
                );

                if (!response.ok) {
                    throw new Error(`Météo HTTP ${response.status}`);
                }

                const weather = await response.json();
                const timezone = weather.timezone || "auto";
                const currentObservation = weather.current || {};
                const forecastHours = weather.hourly?.time || [];
                const nearestHourIndex = findNearestWeatherHour(forecastHours, weatherDate || new Date().toISOString());

                const currentWeatherCode = currentObservation.weather_code ?? weather.hourly?.weather_code?.[nearestHourIndex] ?? 0;
                const currentDescription = getWeatherDescription(currentWeatherCode);
                const currentTemperature = currentObservation.temperature_2m ?? weather.hourly?.temperature_2m?.[nearestHourIndex] ?? 0;
                const currentApparent = currentObservation.apparent_temperature ?? weather.hourly?.apparent_temperature?.[nearestHourIndex] ?? currentTemperature;
                const currentWind = currentObservation.wind_speed_10m ?? weather.hourly?.wind_speed_10m?.[nearestHourIndex] ?? 0;
                const currentRain = Number(currentObservation.precipitation ?? weather.hourly?.precipitation_probability?.[nearestHourIndex] ?? 0);

                const localNow = new Date();
                const localTimeLabel = new Intl.DateTimeFormat("fr-FR", {
                    timeZone: timezone,
                    hour: "2-digit",
                    minute: "2-digit"
                }).format(localNow);

                const localDateLabel = new Intl.DateTimeFormat("fr-FR", {
                    timeZone: timezone,
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }).format(localNow);

                const weatherLabel = stepData?.jour
                    ? `Météo du jour ${stepData.jour}`
                    : "Météo locale";

                const weatherDateLabel = (stepData?.date || weatherDate)
                    ? formatWeatherDate(stepData?.date || weatherDate)
                    : localDateLabel;

                weatherLoading.hidden = true;
                weatherContent.innerHTML = `
                    <div class="weather-heading">
                        <div>
                            <div class="weather-kicker">${weatherLabel} · ${weatherDateLabel}</div>
                            <div class="weather-place">${escapeHTML(place || "Position actuelle")}</div>
                            <div class="weather-updated">Heure locale : ${localTimeLabel}</div>
                        </div>
                        <div class="weather-icon" aria-hidden="true">${currentDescription[1]}</div>
                    </div>
                    <div class="weather-current">
                        <div class="weather-temperature">${Math.round(currentTemperature)}°</div>
                        <div>
                            <div class="weather-description">${currentDescription[0]}</div>
                            <div class="weather-details">
                                <span>Ressenti ${Math.round(currentApparent)}°</span>
                                <span>Vent ${Math.round(currentWind)} km/h</span>
                            </div>
                        </div>
                    </div>
                    <div class="weather-details" style="justify-content: space-between; margin-top: 4px;">
                        <span>Pluie ${Math.round(currentRain)}%</span>
                        <span>${localDateLabel}</span>
                    </div>
                    <div class="weather-forecast">
                        ${(weather.hourly?.time || []).slice(0, 4).map((time, index) => {
                    const hourlyCode = weather.hourly.weather_code[index];
                    const hourlyDescription = getWeatherDescription(hourlyCode);
                    const hourlyTemp = weather.hourly.temperature_2m[index];
                    const hourlyTime = new Intl.DateTimeFormat("fr-FR", {
                        timeZone: timezone,
                        hour: "2-digit"
                    }).format(new Date(time));
                    return `
                                <div class="forecast-day">
                                    ${hourlyTime.replace(":00", "h").replace(" ", "")}
                                    <span class="forecast-icon" aria-hidden="true">${hourlyDescription[1]}</span>
                                    <span class="forecast-temperatures">${Math.round(hourlyTemp)}°</span>
                                </div>
                            `;
                }).join("")}
                    </div>
                `;

            } catch (error) {
                console.warn("Impossible de charger la météo", error);
                weatherLoading.hidden = true;
                weatherContent.innerHTML = `
                    <div class="weather-description">Météo indisponible pour le moment.</div>
                `;
            }

        }

        document
            .getElementById("fitJourney")
            .addEventListener("click", () => {
                if (journeyBounds) {
                    map.fitBounds(journeyBounds, {
                        paddingTopLeft: [50, 150],
                        paddingBottomRight: [50, 100]
                    });
                }
            });

        document
            .getElementById("locateLatest")
            .addEventListener("click", () => {
                if (latestCoordinate) {
                    map.flyTo(latestCoordinate, 10, {
                        duration: 0.8
                    });
                }
            });

        async function fetchLiveWeatherAt(lat, lon) {
            const params = new URLSearchParams({
                latitude: Number(lat).toFixed(4),
                longitude: Number(lon).toFixed(4),
                current: "temperature_2m",
                timezone: "auto",
                forecast_days: "1"
            });

            const response = await fetch(
                `https://api.open-meteo.com/v1/forecast?${params}`
            );

            if (!response.ok) {
                throw new Error(`Météo live HTTP ${response.status}`);
            }

            const weather = await response.json();
            const current = weather.current || {};
            const hourIndex = Math.min(
                Math.max(0, new Date().getHours()),
                (weather.hourly?.time || []).length - 1
            );

            return {
                lat: Number(lat),
                lon: Number(lon),
                temperature: current.temperature_2m ?? weather.hourly?.temperature_2m?.[hourIndex] ?? 0
            };
        }

        async function showLiveWeatherPopup(latlng) {
            try {
                const weather = await fetchLiveWeatherAt(latlng.lat, latlng.lng);
                const content = `
                    <div style="font-family: 'Nunito', sans-serif; min-width: 170px;">
                        <div style="font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.8px; color: #77716a; margin-bottom: 6px;">Météo en direct</div>
                        <div style="font-size: 18px; font-weight: 900; color: #25231f; margin-bottom: 6px;">${Math.round(weather.temperature)}°C</div>
                    </div>
                `;

                L.popup({ closeButton: true, className: "weather-popup" })
                    .setLatLng(latlng)
                    .setContent(content)
                    .openOn(map);
            } catch (error) {
                console.warn("Météo live impossible", error);
                L.popup({ closeButton: true })
                    .setLatLng(latlng)
                    .setContent("Météo en direct indisponible pour ce point.")
                    .openOn(map);
            }
        }

        map.on("click", (event) => {
            showLiveWeatherPopup(event.latlng);
        });


        /* ==================================================
           ICÔNES
        ================================================== */

        function createNormalIcon() {

            return L.divIcon({

                className: "",

                html:
                    `<div class="step-marker"></div>`,

                iconSize: [14, 14],

                iconAnchor: [7, 7],

                popupAnchor: [0, -10]

            });

        }


        function createCurrentIcon() {

            return L.divIcon({

                className: "",

                html:
                    `<div class="current-marker"></div>`,

                iconSize: [20, 20],

                iconAnchor: [10, 10],

                popupAnchor: [0, -15]

            });

        }

        function createNextStepIcon() {

            return L.divIcon({

                className: "",

                html:
                    `<div class="next-step-marker"></div>`,

                iconSize: [16, 16],

                iconAnchor: [8, 8],

                popupAnchor: [0, -10]

            });

        }


        /* ==================================================
           POPUP
        ================================================== */

        function createPopup(etape) {

            const date = etape.date
                ? new Date(etape.date).toLocaleDateString(
                    "fr-FR",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                )
                : "";


            return `

                <div class="popup">

                    <div class="popup-day">
                        Jour ${escapeHTML(etape.jour)}
                    </div>

                    <div class="popup-title">
                        ${escapeHTML(etape.titre)}
                    </div>

                    <div class="popup-description">
                        ${escapeHTML(etape.description)}
                    </div>

                    ${date
                    ? `
                            <div class="popup-date">
                                ${date}
                            </div>
                        `
                    : ""
                }

                </div>

            `;

        }


        /* ==================================================
           PROTECTION HTML
        ================================================== */

        function escapeHTML(text) {

            if (text === null || text === undefined) {
                return "";
            }

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==================================================
           SUPABASE
        ================================================== */

        const SUPABASE_URL =
            "https://cehgwqrcwptcemrvcayt.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable__JEHsgV2wCvzH9xGDvwWxA_Cnh07uJp";

        const journeyVideos = {
            1: "https://www.youtube.com/embed/DSiLnk5AlCE?autoplay=1&rel=0",
            2: "https://www.youtube.com/embed/KTS0wMOnNsc?autoplay=1&rel=0"
        };

        const journeyVideo =
            document.getElementById("journeyVideo");

        const journeyVideoFrame =
            document.getElementById("journeyVideoFrame");

        const journeyVideoTitle =
            document.getElementById("journeyVideoTitle");

        let videoHideTimer;

        function showJourneyVideo(day) {

            const videoUrl = journeyVideos[day];

            if (!videoUrl) {
                return;
            }

            clearTimeout(videoHideTimer);

            journeyVideoTitle.textContent =
                `Résumé vidéo — jour ${day}`;

            if (journeyVideoFrame.src !== videoUrl) {
                journeyVideoFrame.src = videoUrl;
            }

            journeyVideo.classList.add("visible");
            journeyVideo.setAttribute("aria-hidden", "false");

        }

        function hideJourneyVideo() {

            clearTimeout(videoHideTimer);

            journeyVideo.classList.remove("visible");
            journeyVideo.setAttribute("aria-hidden", "true");
            journeyVideoFrame.src = "";

        }

        function scheduleVideoHide() {

            clearTimeout(videoHideTimer);

            videoHideTimer = setTimeout(() => {
                hideJourneyVideo();
            }, 180);

        }

        journeyVideo.addEventListener("mouseenter", () => {
            clearTimeout(videoHideTimer);
        });

        journeyVideo.addEventListener("mouseleave", scheduleVideoHide);

        document
            .getElementById("journeyVideoClose")
            .addEventListener("click", hideJourneyVideo);


        /* ==================================================
           CHARGEMENT DES DONNÉES
        ================================================== */

        async function loadJourney() {

            const loading =
                document.getElementById("loading");


            try {

                const url =
                    `${SUPABASE_URL}/rest/v1/etapes` +
                    `?select=id,jour,latitude,longitude,titre,description,date` +
                    `&order=jour.asc,id.asc`;


                console.log(
                    "Chargement des étapes..."
                );


                const response = await fetch(
                    url,
                    {
                        method: "GET",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`,

                            "Content-Type":
                                "application/json"

                        }
                    }
                );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Réponse Supabase :",
                        errorText
                    );

                    throw new Error(
                        `Erreur API : ${response.status}`
                    );

                }


                const etapes =
                    await response.json();


                console.log(
                    "Étapes récupérées :",
                    etapes
                );


                if (
                    !Array.isArray(etapes) ||
                    etapes.length === 0
                ) {

                    throw new Error(
                        "Aucune étape trouvée."
                    );

                }


                const etapesValides =
                    etapes.filter(etape => {

                        return (
                            etape.latitude !== null &&
                            etape.longitude !== null &&
                            !isNaN(
                                Number(etape.latitude)
                            ) &&
                            !isNaN(
                                Number(etape.longitude)
                            )
                        );

                    });


                if (etapesValides.length === 0) {

                    throw new Error(
                        "Aucune coordonnée valide."
                    );

                }


                await displayJourney(
                    etapesValides
                );


                loading.classList.add(
                    "hidden"
                );


            } catch (error) {

                console.error(
                    "Erreur lors du chargement :",
                    error
                );


                loading.innerHTML = `

                    <div style="
                        text-align: center;
                        padding: 30px;
                    ">

                        <strong>
                            Impossible de charger le parcours.
                        </strong>

                        <br>

                        <small style="
                            display: block;
                            margin-top: 8px;
                            opacity: 0.65;
                        ">
                            Vérifie la connexion à Supabase.
                        </small>

                    </div>

                `;

            }

        }


        /* ==================================================
           CALCUL DU TRAJET ROUTIER
        ================================================== */

        async function drawRoute(coordinates, routeColors) {

            if (coordinates.length < 2) {
                return;
            }


            console.log(
                "Calcul du trajet routier..."
            );


            /*
             * On calcule chaque segment séparément :
             *
             * Dakar → Decathlon
             * Decathlon → Lac Rose
             * Lac Rose → Thiès
             * Thiès → Kébémer
             * etc.
             */

            for (
                let i = 0;
                i < coordinates.length - 1;
                i++
            ) {

                const start =
                    coordinates[i];

                const end =
                    coordinates[i + 1];


                const startLat =
                    start[0];

                const startLng =
                    start[1];

                const endLat =
                    end[0];

                const endLng =
                    end[1];

                const route =
                    routeColors[i] || { color: "#25231f" };

                const color =
                    route.color;


                const url =
                    "https://router.project-osrm.org/route/v1/driving/" +
                    `${startLng},${startLat};` +
                    `${endLng},${endLat}` +
                    "?overview=full&geometries=geojson";


                try {

                    const response =
                        await fetch(url);


                    if (!response.ok) {

                        throw new Error(
                            `OSRM HTTP ${response.status}`
                        );

                    }


                    const data =
                        await response.json();


                    if (
                        data.code !== "Ok" ||
                        !data.routes ||
                        !data.routes.length
                    ) {

                        throw new Error(
                            "Aucune route trouvée."
                        );

                    }


                    const geometry =
                        data.routes[0].geometry;


                    /*
                     * On dessine la vraie géométrie
                     * de la route.
                     */

                    const routeLayer = L.geoJSON(
                        geometry,
                        {
                            style: {

                                color,

                                weight: 5,

                                opacity: 0.92,

                                dashArray: "10 7",

                                lineCap: "round",

                                lineJoin: "round"

                            }
                        }
                    ).addTo(map);

                    if (routeColors[i] && routeColors[i].day) {
                        routeLayer.on("mouseover", () => {
                            routeLayer.setStyle({
                                weight: 9,
                                opacity: 1
                            });
                            showJourneyVideo(routeColors[i].day);
                        });

                        routeLayer.on("mouseout", () => {
                            routeLayer.setStyle({
                                weight: 5,
                                opacity: 0.92
                            });
                            scheduleVideoHide();
                        });
                    }


                } catch (error) {

                    console.warn(
                        `Impossible de calculer le segment ${i + 1}`,
                        error
                    );


                    /*
                     * Si OSRM ne trouve pas la route,
                     * on garde une ligne directe.
                     */

                    const fallbackRoute = L.polyline(
                        [start, end],
                        {

                            color,

                            weight: 5,

                            opacity: 0.8,

                            dashArray: "10 7",

                            lineCap: "round",

                            lineJoin: "round"

                        }
                    ).addTo(map);

                    if (routeColors[i] && routeColors[i].day) {
                        fallbackRoute.on("mouseover", () => {
                            fallbackRoute.setStyle({
                                weight: 9,
                                opacity: 1
                            });
                            showJourneyVideo(routeColors[i].day);
                        });

                        fallbackRoute.on("mouseout", () => {
                            fallbackRoute.setStyle({
                                weight: 5,
                                opacity: 0.8
                            });
                            scheduleVideoHide();
                        });
                    }

                }

            }


            console.log(
                "Trajet terminé."
            );

        }


        /* ==================================================
           AFFICHAGE
        ================================================== */

        async function displayJourney(etapes) {

            const FIXED_NEXT_STEP_ID = 1000;

            const currentStep =
                etapes
                    .filter(step => Number(step.id) !== FIXED_NEXT_STEP_ID)
                    .sort((a, b) => Number(b.id) - Number(a.id))[0] ||
                etapes[etapes.length - 1] ||
                null;

            const latestIndex = currentStep
                ? etapes.findIndex(step => Number(step.id) === Number(currentStep.id))
                : etapes.length - 1;

            const nextStep =
                etapes.find(step => Number(step.id) === FIXED_NEXT_STEP_ID) ||
                null;

            const currentPoint = currentStep
                ? [Number(currentStep.latitude), Number(currentStep.longitude)]
                : null;

            const nextPoint = nextStep
                ? [Number(nextStep.latitude), Number(nextStep.longitude)]
                : null;

            /*
             * Marqueurs
             */
            etapes.forEach((etape, index) => {

                const lat =
                    Number(etape.latitude);

                const lng =
                    Number(etape.longitude);


                const isCurrent =
                    Number(etape.id) === Number(currentStep?.id);


                const marker =
                    L.marker(
                        [lat, lng],
                        {

                            icon:
                                isCurrent
                                    ? createCurrentIcon()
                                    : createNormalIcon(),

                            zIndexOffset:
                                isCurrent
                                    ? 1000
                                    : 0

                        }
                    );


                marker
                    .bindPopup(
                        createPopup(etape),
                        {
                            closeButton: true
                        }
                    )
                    .on("click", () => {
                        loadWeather(
                            [lat, lng],
                            etape.titre,
                            etape
                        );
                    })
                    .addTo(map);


                /*
                 * Animation d'apparition
                 */
                setTimeout(() => {

                    marker.getElement()?.classList.add(
                        "marker-visible"
                    );

                }, index * 100);

            });


            const coordinates = etapes.map(etape => [
                Number(etape.latitude),
                Number(etape.longitude)
            ]);

            const routeCoordinates = etapes
                .filter(etape => Number(etape.id) !== FIXED_NEXT_STEP_ID)
                .map(etape => [
                    Number(etape.latitude),
                    Number(etape.longitude)
                ]);

            const dayColors = [
                "#e35d3f",
                "#3f7cac",
                "#5f8f5f",
                "#8b6fa8",
                "#c28b45",
                "#2f8f9d",
                "#b76565",
                "#77716a"
            ];

            const daysPresent = [...new Set(
                etapes
                    .filter(etape => Number(etape.jour) > 0)
                    .map(etape => Number(etape.jour))
            )];
            const legendItems = document.getElementById("legendItems");

            legendItems.innerHTML = daysPresent.map(day => `
                <div class="legend-item">
                    <span class="legend-swatch" style="background:${dayColors[(day - 1) % dayColors.length]}"></span>
                    <span>Jour ${escapeHTML(day)}</span>
                </div>
            `).join("");

            if (nextStep && Number(nextStep.jour) === 0) {
                legendItems.innerHTML += `
                    <div class="legend-item">
                        <span class="legend-swatch" style="background:#8e8a84"></span>
                        <span>Prochaine étape</span>
                    </div>
                `;
            }

            document.getElementById("stepCount").textContent =
                `${etapes.length} étapes`;

            document.getElementById("routeStatus").textContent =
                `${daysPresent.length} jours cartographiés`;

            const routeColors = routeCoordinates.slice(0, -1).map((_, index) => {
                const etape = etapes.filter(step => Number(step.id) !== FIXED_NEXT_STEP_ID)[index];
                const day = Number(etape?.jour || 0);
                const isNeutral = day === 0 || Number(etape?.id) === FIXED_NEXT_STEP_ID;

                return {
                    day,
                    color: isNeutral ? "#8e8a84" : dayColors[(day - 1) % dayColors.length]
                };

            });

            await drawRoute(routeCoordinates, routeColors);


            /*
             * Compteur
             */
            const currentDay =
                document.getElementById("currentDay");

            currentDay.textContent =
                currentStep?.jour ?? etapes[latestIndex]?.jour ?? "";

            const latestCoordinateValue = currentPoint || coordinates[latestIndex] || coordinates[coordinates.length - 1] || null;

            latestCoordinate = latestCoordinateValue;

            if (currentPoint && nextPoint && coordinates.length > 1) {
                await drawRoute(
                    [currentPoint, nextPoint],
                    [{ day: 0, color: "#8e8a84" }]
                );

                const nextStepMarker = L.marker(nextPoint, {
                    icon: createNextStepIcon(),
                    zIndexOffset: 200
                }).addTo(map);

                nextStepMarker.bindPopup(`
                    <div class="popup">
                        <div class="popup-day">Prochaine étape</div>
                        <div class="popup-title">${escapeHTML(nextStep.titre || "À venir")}</div>
                        <div class="popup-description">${escapeHTML(nextStep.description || "Suite du parcours.")}</div>
                    </div>
                `);
            }

            loadWeather(
                latestCoordinateValue,
                currentStep?.titre ?? etapes[latestIndex]?.titre ?? "Position actuelle",
                currentStep ?? etapes[latestIndex]
            );


            if (coordinates.length > 1) {

                const bounds =
                    L.latLngBounds(coordinates);

                journeyBounds = bounds;


                map.fitBounds(
                    bounds,
                    {
                        paddingTopLeft: [50, 150],
                        paddingBottomRight: [50, 100]
                    }
                );

            }

        }


        /* ==================================================
           LANCEMENT
        ================================================== */

        loadJourney();
        initTwitchLive();

    </script>
