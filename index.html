<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Le parcours — Dakar → Paris</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Nunito", sans-serif;
            background: #f4f0e8;
        }

        /* =========================
           CARTE
        ========================= */

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: fixed;
            top: 24px;
            left: 24px;

            z-index: 1000;

            padding: 18px 22px;

            background: rgba(255, 252, 246, 0.94);
            backdrop-filter: blur(14px);

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);

            max-width: 340px;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1.5px;

            color: #77716a;

            margin-bottom: 4px;
        }

        .header h1 {
            font-size: 28px;
            line-height: 1;

            font-weight: 900;

            color: #25231f;

            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            line-height: 1.45;

            color: #625e57;
        }

        .header-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .header-meta span {
            padding: 5px 9px;
            border-radius: 999px;
            background: #eee8de;
            color: #625e57;
            font-size: 11px;
            font-weight: 800;
        }

        /* =========================
           COMPTEUR
        ========================= */

        .progress {
            position: fixed;

            right: 24px;
            top: 24px;

            z-index: 1000;

            background: rgba(255, 252, 246, 0.94);
            backdrop-filter: blur(14px);

            border-radius: 18px;

            padding: 14px 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .progress-number {
            display: block;

            font-size: 28px;
            line-height: 1;

            font-weight: 900;

            color: #25231f;
        }

        .progress-label {
            display: block;

            margin-top: 3px;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 1px;

            color: #77716a;
        }

        .map-tools {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .map-tool {
            min-height: 40px;
            padding: 0 13px;
            border: 1px solid rgba(37, 35, 31, 0.12);
            border-radius: 12px;
            background: rgba(255, 252, 246, 0.94);
            color: #25231f;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 900;
        }

        .map-tool:hover,
        .map-tool:focus-visible {
            background: #25231f;
            color: #fff;
            outline: none;
        }

        .map-legend {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 1000;
            width: 190px;
            padding: 14px;
            border: 1px solid rgba(37, 35, 31, 0.1);
            border-radius: 15px;
            background: rgba(255, 252, 246, 0.94);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .legend-title {
            margin-bottom: 9px;
            color: #25231f;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .legend-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #625e57;
            font-size: 11px;
            font-weight: 800;
        }

        .legend-swatch {
            width: 18px;
            height: 5px;
            border-radius: 4px;
        }

        /* =========================
           MARQUEURS
        ========================= */

        .step-marker {
            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #25231f;

            border: 3px solid #fff;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .current-marker {
            position: relative;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: #e35d3f;

            border: 4px solid white;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.25);
        }

        .current-marker::before {
            content: "";

            position: absolute;

            top: 50%;
            left: 50%;

            width: 34px;
            height: 34px;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border: 2px solid rgba(227, 93, 63, 0.55);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0% {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 1;
            }

            70% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        /* =========================
           POPUP
        ========================= */

        .leaflet-popup-content-wrapper {
            border-radius: 18px;

            padding: 0;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.16);
        }

        .leaflet-popup-content {
            margin: 0;

            width: 260px !important;
        }

        .popup {
            padding: 18px;
        }

        .popup-day {
            display: inline-block;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1px;

            color: #e35d3f;

            margin-bottom: 5px;
        }

        .popup-title {
            font-size: 20px;
            font-weight: 900;

            color: #25231f;

            margin-bottom: 7px;
        }

        .popup-description {
            font-size: 13px;
            line-height: 1.5;

            color: #625e57;
        }

        .popup-date {
            margin-top: 12px;

            font-size: 11px;
            font-weight: 700;

            color: #999188;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            position: fixed;

            inset: 0;

            z-index: 2000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f4f0e8;

            font-size: 16px;
            font-weight: 800;

            color: #25231f;

            transition: opacity 0.4s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* =========================
           VIDÉO DU JOUR
        ========================= */

        .journey-video {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1200;
            width: min(360px, calc(100vw - 48px));
            padding: 12px;
            background: rgba(255, 252, 246, 0.96);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(37, 35, 31, 0.12);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .journey-video.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .journey-video-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 2px 9px;
        }

        .journey-video-title {
            font-size: 13px;
            font-weight: 900;
            color: #25231f;
        }

        .journey-video-close {
            display: grid;
            width: 26px;
            height: 26px;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: #eee8de;
            color: #25231f;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .journey-video-close:hover {
            background: #e35d3f;
            color: #fff;
        }

        .journey-video-frame {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 11px;
            background: #25231f;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                top: 14px;
                left: 14px;
                right: 14px;

                max-width: none;

                padding: 15px 17px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 13px;
            }

            .progress {
                top: auto;
                right: 14px;
                bottom: 20px;

                padding: 11px 15px;
            }

            .progress-number {
                font-size: 23px;
            }

            .map-tools {
                top: auto;
                right: 14px;
                bottom: 76px;
            }

            .map-tool {
                min-height: 36px;
                padding: 0 10px;
                font-size: 11px;
            }

            .map-legend {
                display: none;
            }

            .journey-video {
                right: 14px;
                bottom: 14px;
                width: calc(100vw - 28px);
            }
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div class="loading" id="loading">
        Le parcours se charge...
    </div>

    <!-- Header -->
    <div class="header">

        <div class="eyebrow">
            Dakar → Paris
        </div>

        <h1>
            Le parcours
        </h1>

        <p>
            31 jours à pied et en stop.
            Suivez chaque étape du voyage de Nico,
            Ilhan et Flamby.
        </p>

        <div class="header-meta">
            <span id="stepCount">Chargement...</span>
            <span id="routeStatus">Parcours en cours</span>
        </div>

    </div>

    <!-- Compteur -->
    <div class="progress">

        <span class="progress-number" id="currentDay">
            —
        </span>

        <span class="progress-label">
            jours parcourus
        </span>

    </div>

    <div class="map-tools" aria-label="Outils de carte">
        <button class="map-tool" id="fitJourney" type="button">Voir le voyage</button>
        <button class="map-tool" id="locateLatest" type="button">Dernière étape</button>
    </div>

    <aside class="map-legend" aria-label="Légende des jours">
        <div class="legend-title">Couleurs des jours</div>
        <div class="legend-items" id="legendItems"></div>
    </aside>

    <!-- Résumé vidéo affiché au survol d'un trajet -->
    <aside class="journey-video" id="journeyVideo" aria-hidden="true">

        <div class="journey-video-header">
            <span class="journey-video-title" id="journeyVideoTitle"></span>
            <button class="journey-video-close" id="journeyVideoClose" type="button" title="Fermer la vidéo"
                aria-label="Fermer la vidéo">
                ×
            </button>
        </div>

        <iframe class="journey-video-frame" id="journeyVideoFrame" title="Résumé vidéo du jour"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </aside>

    <!-- Carte -->
    <div id="map"></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

        /* ==================================================
           CARTE
        ================================================== */

        const map = L.map("map", {

            zoomControl: false,

            center: [22, -5],

            zoom: 4

        });


        /* Fond de carte */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }
        ).addTo(map);

        /* Zoom */

        L.control.zoom({
            position: "bottomright"
        }).addTo(map);

        let journeyBounds = null;
        let latestCoordinate = null;

        document
            .getElementById("fitJourney")
            .addEventListener("click", () => {
                if (journeyBounds) {
                    map.fitBounds(journeyBounds, {
                        paddingTopLeft: [50, 150],
                        paddingBottomRight: [50, 100]
                    });
                }
            });

        document
            .getElementById("locateLatest")
            .addEventListener("click", () => {
                if (latestCoordinate) {
                    map.flyTo(latestCoordinate, 10, {
                        duration: 0.8
                    });
                }
            });


        /* ==================================================
           ICÔNES
        ================================================== */

        function createNormalIcon() {

            return L.divIcon({

                className: "",

                html:
                    `<div class="step-marker"></div>`,

                iconSize: [14, 14],

                iconAnchor: [7, 7],

                popupAnchor: [0, -10]

            });

        }


        function createCurrentIcon() {

            return L.divIcon({

                className: "",

                html:
                    `<div class="current-marker"></div>`,

                iconSize: [20, 20],

                iconAnchor: [10, 10],

                popupAnchor: [0, -15]

            });

        }


        /* ==================================================
           POPUP
        ================================================== */

        function createPopup(etape) {

            const date = etape.date
                ? new Date(etape.date).toLocaleDateString(
                    "fr-FR",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                )
                : "";


            return `

                <div class="popup">

                    <div class="popup-day">
                        Jour ${escapeHTML(etape.jour)}
                    </div>

                    <div class="popup-title">
                        ${escapeHTML(etape.titre)}
                    </div>

                    <div class="popup-description">
                        ${escapeHTML(etape.description)}
                    </div>

                    ${date
                    ? `
                            <div class="popup-date">
                                ${date}
                            </div>
                        `
                    : ""
                }

                </div>

            `;

        }


        /* ==================================================
           PROTECTION HTML
        ================================================== */

        function escapeHTML(text) {

            if (text === null || text === undefined) {
                return "";
            }

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==================================================
           SUPABASE
        ================================================== */

        const SUPABASE_URL =
            "https://cehgwqrcwptcemrvcayt.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable__JEHsgV2wCvzH9xGDvwWxA_Cnh07uJp";

        const journeyVideos = {
            1: "https://www.youtube.com/embed/DSiLnk5AlCE?autoplay=1&rel=0",
            2: "https://www.youtube.com/embed/KTS0wMOnNsc?autoplay=1&rel=0"
        };

        const journeyVideo =
            document.getElementById("journeyVideo");

        const journeyVideoFrame =
            document.getElementById("journeyVideoFrame");

        const journeyVideoTitle =
            document.getElementById("journeyVideoTitle");

        let videoHideTimer;

        function showJourneyVideo(day) {

            const videoUrl = journeyVideos[day];

            if (!videoUrl) {
                return;
            }

            clearTimeout(videoHideTimer);

            journeyVideoTitle.textContent =
                `Résumé vidéo — jour ${day}`;

            if (journeyVideoFrame.src !== videoUrl) {
                journeyVideoFrame.src = videoUrl;
            }

            journeyVideo.classList.add("visible");
            journeyVideo.setAttribute("aria-hidden", "false");

        }

        function hideJourneyVideo() {

            clearTimeout(videoHideTimer);

            journeyVideo.classList.remove("visible");
            journeyVideo.setAttribute("aria-hidden", "true");
            journeyVideoFrame.src = "";

        }

        function scheduleVideoHide() {

            clearTimeout(videoHideTimer);

            videoHideTimer = setTimeout(() => {
                hideJourneyVideo();
            }, 180);

        }

        journeyVideo.addEventListener("mouseenter", () => {
            clearTimeout(videoHideTimer);
        });

        journeyVideo.addEventListener("mouseleave", scheduleVideoHide);

        document
            .getElementById("journeyVideoClose")
            .addEventListener("click", hideJourneyVideo);


        /* ==================================================
           CHARGEMENT DES DONNÉES
        ================================================== */

        async function loadJourney() {

            const loading =
                document.getElementById("loading");


            try {

                const url =
                    `${SUPABASE_URL}/rest/v1/etapes` +
                    `?select=jour,latitude,longitude,titre,description,date` +
                    `&order=jour.asc,id.asc`;


                console.log(
                    "Chargement des étapes..."
                );


                const response = await fetch(
                    url,
                    {
                        method: "GET",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`,

                            "Content-Type":
                                "application/json"

                        }
                    }
                );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Réponse Supabase :",
                        errorText
                    );

                    throw new Error(
                        `Erreur API : ${response.status}`
                    );

                }


                const etapes =
                    await response.json();


                console.log(
                    "Étapes récupérées :",
                    etapes
                );


                if (
                    !Array.isArray(etapes) ||
                    etapes.length === 0
                ) {

                    throw new Error(
                        "Aucune étape trouvée."
                    );

                }


                const etapesValides =
                    etapes.filter(etape => {

                        return (
                            etape.latitude !== null &&
                            etape.longitude !== null &&
                            !isNaN(
                                Number(etape.latitude)
                            ) &&
                            !isNaN(
                                Number(etape.longitude)
                            )
                        );

                    });


                if (etapesValides.length === 0) {

                    throw new Error(
                        "Aucune coordonnée valide."
                    );

                }


                await displayJourney(
                    etapesValides
                );


                loading.classList.add(
                    "hidden"
                );


            } catch (error) {

                console.error(
                    "Erreur lors du chargement :",
                    error
                );


                loading.innerHTML = `

                    <div style="
                        text-align: center;
                        padding: 30px;
                    ">

                        <strong>
                            Impossible de charger le parcours.
                        </strong>

                        <br>

                        <small style="
                            display: block;
                            margin-top: 8px;
                            opacity: 0.65;
                        ">
                            Vérifie la connexion à Supabase.
                        </small>

                    </div>

                `;

            }

        }


        /* ==================================================
           CALCUL DU TRAJET ROUTIER
        ================================================== */

        async function drawRoute(coordinates, routeColors) {

            if (coordinates.length < 2) {
                return;
            }


            console.log(
                "Calcul du trajet routier..."
            );


            /*
             * On calcule chaque segment séparément :
             *
             * Dakar → Decathlon
             * Decathlon → Lac Rose
             * Lac Rose → Thiès
             * Thiès → Kébémer
             * etc.
             */

            for (
                let i = 0;
                i < coordinates.length - 1;
                i++
            ) {

                const start =
                    coordinates[i];

                const end =
                    coordinates[i + 1];


                const startLat =
                    start[0];

                const startLng =
                    start[1];

                const endLat =
                    end[0];

                const endLng =
                    end[1];

                const route =
                    routeColors[i] || { color: "#25231f" };

                const color =
                    route.color;


                const url =
                    "https://router.project-osrm.org/route/v1/driving/" +
                    `${startLng},${startLat};` +
                    `${endLng},${endLat}` +
                    "?overview=full&geometries=geojson";


                try {

                    const response =
                        await fetch(url);


                    if (!response.ok) {

                        throw new Error(
                            `OSRM HTTP ${response.status}`
                        );

                    }


                    const data =
                        await response.json();


                    if (
                        data.code !== "Ok" ||
                        !data.routes ||
                        !data.routes.length
                    ) {

                        throw new Error(
                            "Aucune route trouvée."
                        );

                    }


                    const geometry =
                        data.routes[0].geometry;


                    /*
                     * On dessine la vraie géométrie
                     * de la route.
                     */

                    const routeLayer = L.geoJSON(
                        geometry,
                        {
                            style: {

                                color,

                                weight: 5,

                                opacity: 0.92,

                                dashArray: "10 7",

                                lineCap: "round",

                                lineJoin: "round"

                            }
                        }
                    ).addTo(map);

                    if (routeColors[i] && routeColors[i].day) {
                        routeLayer.on("mouseover", () => {
                            routeLayer.setStyle({
                                weight: 9,
                                opacity: 1
                            });
                            showJourneyVideo(routeColors[i].day);
                        });

                        routeLayer.on("mouseout", () => {
                            routeLayer.setStyle({
                                weight: 5,
                                opacity: 0.92
                            });
                            scheduleVideoHide();
                        });
                    }


                } catch (error) {

                    console.warn(
                        `Impossible de calculer le segment ${i + 1}`,
                        error
                    );


                    /*
                     * Si OSRM ne trouve pas la route,
                     * on garde une ligne directe.
                     */

                    const fallbackRoute = L.polyline(
                        [start, end],
                        {

                            color,

                            weight: 5,

                            opacity: 0.8,

                            dashArray: "10 7",

                            lineCap: "round",

                            lineJoin: "round"

                        }
                    ).addTo(map);

                    if (routeColors[i] && routeColors[i].day) {
                        fallbackRoute.on("mouseover", () => {
                            fallbackRoute.setStyle({
                                weight: 9,
                                opacity: 1
                            });
                            showJourneyVideo(routeColors[i].day);
                        });

                        fallbackRoute.on("mouseout", () => {
                            fallbackRoute.setStyle({
                                weight: 5,
                                opacity: 0.8
                            });
                            scheduleVideoHide();
                        });
                    }

                }

            }


            console.log(
                "Trajet terminé."
            );

        }


        /* ==================================================
           AFFICHAGE
        ================================================== */

        async function displayJourney(etapes) {

            const latestIndex = etapes.length - 1;

            /*
             * Marqueurs
             */
            etapes.forEach((etape, index) => {

                const lat =
                    Number(etape.latitude);

                const lng =
                    Number(etape.longitude);


                const isCurrent =
                    index === latestIndex;


                const marker =
                    L.marker(
                        [lat, lng],
                        {

                            icon:
                                isCurrent
                                    ? createCurrentIcon()
                                    : createNormalIcon(),

                            zIndexOffset:
                                isCurrent
                                    ? 1000
                                    : 0

                        }
                    );


                marker
                    .bindPopup(
                        createPopup(etape),
                        {
                            closeButton: true
                        }
                    )
                    .addTo(map);


                /*
                 * Animation d'apparition
                 */
                setTimeout(() => {

                    marker.getElement()?.classList.add(
                        "marker-visible"
                    );

                }, index * 100);

            });


            const coordinates = etapes.map(etape => [
                Number(etape.latitude),
                Number(etape.longitude)
            ]);

            const dayColors = [
                "#e35d3f",
                "#3f7cac",
                "#5f8f5f",
                "#8b6fa8",
                "#c28b45",
                "#2f8f9d",
                "#b76565",
                "#77716a"
            ];

            const daysPresent = [...new Set(etapes.map(etape => Number(etape.jour)))];
            const legendItems = document.getElementById("legendItems");

            legendItems.innerHTML = daysPresent.map(day => `
                <div class="legend-item">
                    <span class="legend-swatch" style="background:${dayColors[(day - 1) % dayColors.length]}"></span>
                    <span>Jour ${escapeHTML(day)}</span>
                </div>
            `).join("");

            document.getElementById("stepCount").textContent =
                `${etapes.length} étapes`;

            document.getElementById("routeStatus").textContent =
                `${daysPresent.length} jours cartographiés`;

            const routeColors = etapes.slice(0, -1).map(etape => {

                const day = Number(etape.jour);

                return {
                    day,
                    color: dayColors[(day - 1) % dayColors.length]
                };

            });

            await drawRoute(coordinates, routeColors);


            /*
             * Compteur
             */
            const currentDay =
                document.getElementById("currentDay");


            currentDay.textContent =
                etapes[latestIndex].jour;

            latestCoordinate = coordinates[latestIndex];


            if (coordinates.length > 1) {

                const bounds =
                    L.latLngBounds(coordinates);

                journeyBounds = bounds;


                map.fitBounds(
                    bounds,
                    {
                        paddingTopLeft: [50, 150],
                        paddingBottomRight: [50, 100]
                    }
                );

            }

        }


        /* ==================================================
           LANCEMENT
        ================================================== */

        loadJourney();

    </script>

</body>
